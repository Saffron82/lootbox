<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LootBox</title>

    <!-- PWA Home Screen Icon (Self-Contained SVG) -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f172a'/%3E%3Ctext y='70' x='15' font-size='70'%3E📦%3C/text%3E%3C/svg%3E">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f172a'/%3E%3Ctext y='70' x='15' font-size='70'%3E📦%3C/text%3E%3C/svg%3E">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Firebase App & Firestore SDK (v10.7.1 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- Firebase Initialization -->
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyArfQr3quM1aLp-9FwtQykf4bRo57ajxc",
        authDomain: "lootbox-7162c.firebaseapp.com",
        projectId: "lootbox-7162c",
        storageBucket: "lootbox-7162c.firebasestorage.app",
        messagingSenderId: "128137949582",
        appId: "1:128137949582:web:956634ae3b7341076774df",
        measurementId: "G-H0434TZQ01"
      };

      if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
      }
      const db = firebase.firestore();
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- App Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <h1 class="text-xl font-bold text-amber-400 flex items-center gap-2">
                <span>📦</span> LootBox
            </h1>
            <div id="connection-status" class="text-xs px-2.5 py-1 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800">
                Connected
            </div>
        </div>
    </header>

    <!-- Main Application View -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col gap-6">
        
        <!-- Role Selection Screen -->
        <section id="role-select-screen" class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl flex flex-col gap-4">
            <h2 class="text-lg font-semibold text-slate-200">Join Tabletop Session</h2>
            <div class="flex flex-col gap-3">
                <input type="text" id="session-code" placeholder="Session Room Name (e.g., Campaign1)" class="bg-slate-950 border border-slate-700 rounded-lg p-3 text-slate-100 focus:outline-none focus:border-amber-500">
                <input type="text" id="user-name" placeholder="Your Name / Character Name" class="bg-slate-950 border border-slate-700 rounded-lg p-3 text-slate-100 focus:outline-none focus:border-amber-500">
            </div>
            <div class="grid grid-cols-2 gap-4 mt-2">
                <button onclick="joinSession('dm')" class="bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold py-3 px-4 rounded-lg transition-colors">
                    Login as Dungeon Master
                </button>
                <button onclick="joinSession('player')" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded-lg transition-colors">
                    Login as Player
                </button>
            </div>
        </section>

        <!-- DM Dashboard View (Hidden by Default) -->
        <section id="dm-dashboard" class="hidden flex-col gap-4">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl">
                <h2 class="text-xl font-bold text-amber-400 mb-4">Dungeon Master Control Panel</h2>
                <p class="text-sm text-slate-400 mb-4">Active Session: <span id="active-dm-room" class="text-slate-200 font-mono"></span></p>
                <h3 class="text-md font-semibold text-slate-300 mb-2">Connected Party Members:</h3>
                <div id="dm-player-list" class="flex flex-col gap-2">
                    <div class="p-3 bg-slate-950 rounded-lg border border-slate-800 text-slate-400 text-sm">Waiting for players to join...</div>
                </div>
            </div>
        </section>

        <!-- Player Sheet View (Hidden by Default) -->
        <section id="player-dashboard" class="hidden flex-col gap-4">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl flex flex-col gap-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-xl font-bold text-indigo-400" id="player-display-name">Character Sheet</h2>
                    <span class="text-xs bg-slate-800 px-3 py-1 rounded-full text-slate-300 font-mono" id="active-player-room"></span>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Gold Card -->
                    <div class="bg-slate-950 p-4 rounded-lg border border-slate-800 flex flex-col gap-1">
                        <span class="text-xs text-slate-400 uppercase tracking-wider">Gold Pieces</span>
                        <div class="flex items-center gap-2 mt-1">
                            <span id="player-gold" class="text-2xl font-bold text-amber-400">0</span>
                            <button onclick="updateGold(10)" class="bg-slate-800 hover:bg-slate-700 text-xs px-2.5 py-1 rounded font-bold">+10</button>
                            <button onclick="updateGold(-10)" class="bg-slate-800 hover:bg-slate-700 text-xs px-2.5 py-1 rounded font-bold">-10</button>
                        </div>
                    </div>

                    <!-- Inventory Card -->
                    <div class="bg-slate-950 p-4 rounded-lg border border-slate-800 flex flex-col gap-3">
                        <div class="flex justify-between items-center">
                            <span class="text-xs text-slate-400 uppercase tracking-wider">Inventory Items</span>
                            <button onclick="addItem()" class="bg-indigo-600 hover:bg-indigo-500 text-xs px-2.5 py-1 rounded text-white font-bold">+ Add Item</button>
                        </div>
                        <div id="player-inventory-list" class="flex flex-col gap-2 max-h-48 overflow-y-auto">
                            <span class="text-xs text-slate-500 italic">No items in inventory.</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Application Controller Script -->
    <script>
        let currentRoom = "";
        let currentRole = "";
        let playerName = "";
        let playerDocRef = null;

        function joinSession(role) {
            currentRoom = document.getElementById("session-code").value.trim();
            playerName = document.getElementById("user-name").value.trim();
            currentRole = role;

            if (!currentRoom || !playerName) {
                alert("Please enter both a session room name and your name.");
                return;
            }

            document.getElementById("role-select-screen").classList.add("hidden");

            if (role === 'dm') {
                document.getElementById("dm-dashboard").classList.remove("hidden");
                document.getElementById("active-dm-room").innerText = currentRoom;
                initDMListener();
            } else {
                document.getElementById("player-dashboard").classList.remove("hidden");
                document.getElementById("player-display-name").innerText = playerName;
                document.getElementById("active-player-room").innerText = currentRoom;
                initPlayerSync();
            }
        }

        function initPlayerSync() {
            playerDocRef = db.collection("sessions").doc(currentRoom).collection("players").doc(playerName);
            
            playerDocRef.get().then((doc) => {
                if (!doc.exists) {
                    playerDocRef.set({
                        name: playerName,
                        gold: 50,
                        inventory: ["Health Potion", "Torch", "Rations"],
                        lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
            });

            playerDocRef.onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    document.getElementById("player-gold").innerText = data.gold || 0;
                    renderInventory(data.inventory || []);
                }
            });
        }

        function updateGold(amount) {
            if (!playerDocRef) return;
            playerDocRef.get().then((doc) => {
                let currentGold = doc.exists ? (doc.data().gold || 0) : 0;
                let newGold = Math.max(0, currentGold + amount);
                playerDocRef.update({ 
                    gold: newGold,
                    lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                });
            });
        }

        function addItem() {
            if (!playerDocRef) return;
            let itemName = prompt("Enter item name:");
            if (!itemName) return;

            playerDocRef.get().then((doc) => {
                if (doc.exists) {
                    let inventory = doc.data().inventory || [];
                    inventory.push(itemName);
                    playerDocRef.update({ 
                        inventory: inventory,
                        lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
            });
        }

        function renderInventory(items) {
            const container = document.getElementById("player-inventory-list");
            container.innerHTML = "";
            if (items.length === 0) {
                container.innerHTML = '<span class="text-xs text-slate-500 italic">No items in inventory.</span>';
                return;
            }
            items.forEach((item, index) => {
                const div = document.createElement("div");
                div.className = "p-2 bg-slate-900 rounded border border-slate-800 text-sm flex justify-between items-center text-slate-300";
                div.innerHTML = `<span>${item}</span><button onclick="removeItem(${index})" class="text-red-400 hover:text-red-300 text-xs px-1.5 py-0.5">✕</button>`;
                container.appendChild(div);
            });
        }

        function removeItem(index) {
            if (!playerDocRef) return;
            playerDocRef.get().then((doc) => {
                if (doc.exists) {
                    let inventory = doc.data().inventory || [];
                    inventory.splice(index, 1);
                    playerDocRef.update({ 
                        inventory: inventory,
                        lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
            });
        }

        function initDMListener() {
            db.collection("sessions").doc(currentRoom).collection("players")
                .onSnapshot((snapshot) => {
                    const listContainer = document.getElementById("dm-player-list");
                    listContainer.innerHTML = "";
                    if (snapshot.empty) {
                        listContainer.innerHTML = '<div class="p-3 bg-slate-950 rounded-lg border border-slate-800 text-slate-400 text-sm">Waiting for players to join...</div>';
                        return;
                    }
                    snapshot.forEach((doc) => {
                        const data = doc.data();
                        const item = document.createElement("div");
                        item.className = "p-3 bg-slate-950 rounded-lg border border-slate-800 flex justify-between items-center";
                        
                        let inventoryText = (data.inventory && data.inventory.length > 0) ? data.inventory.join(", ") : "Empty inventory";
                        
                        item.innerHTML = `
                            <div>
                                <div class="font-semibold text-slate-200">${data.name}</div>
                                <div class="text-xs text-slate-400">Items: ${inventoryText}</div>
                            </div>
                            <div class="text-amber-400 font-mono font-bold">${data.gold || 0} Gold</div>
                        `;
                        listContainer.appendChild(item);
                    });
                });
        }
    </script>
</body>
</html>
