<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LootBox TRPG - Pathfinder & D&D 5e Inventory & Merchant Manager</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        amber: {
                            450: '#F59E0B',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase App & Firestore via CDN (Modular v9/v10 compat mode for single file) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        h1, h2, h3, h4, .font-cinzel {
            font-family: 'Cinzel', serif;
        }
        .bg-slate-950 { background-color: #020617; }
        .border-amber-600\/30 { border-color: rgba(217, 119, 6, 0.3); }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: #1e293b; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- TOP BAR / HEADER -->
    <header class="bg-slate-950 border-b border-amber-600/30 sticky top-0 z-40 shadow-lg">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <!-- Dual-Tone Minimalist Emblem Logo -->
                <svg viewBox="0 0 400 400" class="w-10 h-10 text-amber-500 drop-shadow" fill="none" stroke="currentColor">
                    <circle cx="200" cy="180" r="160" stroke="#d97706" stroke-width="6" stroke-dasharray="8 4" opacity="0.6"/>
                    <circle cx="200" cy="180" r="150" stroke="#d97706" stroke-width="3"/>
                    <path d="M 140 80 Q 200 60 260 80 L 260 190 Q 200 270 140 190 Z" fill="#1e293b" stroke="#d97706" stroke-width="4"/>
                    <path d="M 90 200 C 60 160 80 100 130 90 C 110 120 125 145 140 150 C 120 170 110 190 90 200 Z" fill="#d97706"/>
                    <path d="M 310 200 C 340 160 320 100 270 90 C 290 120 275 145 260 150 C 280 170 290 190 310 200 Z" fill="#d97706"/>
                    <rect x="155" y="150" width="90" height="65" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="4"/>
                    <path d="M 150 150 Q 200 125 250 150 Z" fill="#d97706" stroke="#fbbf24" stroke-width="4"/>
                    <circle cx="200" cy="180" r="7" fill="#fbbf24"/>
                </svg>
                <div>
                    <h1 class="text-xl font-bold tracking-wider text-amber-500 flex items-center gap-1.5">
                        LOOTBOX
                        <span class="text-xs font-sans bg-amber-500/20 text-amber-300 px-1.5 py-0.5 rounded border border-amber-500/30">TRPG</span>
                    </h1>
                    <p class="text-xs text-slate-400">Pathfinder & D&D 5e Inventory System</p>
                </div>
            </div>

            <!-- Login / Character Profile Status -->
            <div id="user-profile-bar" class="hidden items-center space-x-3">
                <div class="text-right">
                    <span id="display-user-name" class="font-bold text-amber-400 block text-sm">Character Name</span>
                    <span id="display-user-role" class="text-xs text-slate-400">Player</span>
                </div>
                <button onclick="logout()" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700 transition" title="Log Out">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- NOTIFICATION TOAST -->
    <div id="toast" class="fixed top-16 right-4 z-50 bg-amber-600 text-slate-950 px-4 py-3 rounded-lg shadow-xl font-medium hidden transform transition-all duration-300 flex items-center space-x-2">
        <i data-lucide="bell" class="w-5 h-5"></i>
        <span id="toast-message">Notification message</span>
    </div>

    <!-- MAIN APP CONTAINER -->
    <main class="flex-grow max-w-4xl w-full mx-auto p-4 pb-24">

        <!-- 1. LOGIN SCREEN -->
        <section id="login-section" class="max-w-md mx-auto my-8 bg-slate-800/90 border border-amber-600/30 rounded-xl p-6 shadow-2xl backdrop-blur-sm">
            <div class="text-center mb-6">
                <div class="w-24 h-24 mx-auto mb-3">
                    <svg viewBox="0 0 400 400" class="w-full h-full text-amber-500" fill="none" stroke="currentColor">
                        <circle cx="200" cy="180" r="160" stroke="#d97706" stroke-width="6" stroke-dasharray="8 4" opacity="0.6"/>
                        <circle cx="200" cy="180" r="150" stroke="#d97706" stroke-width="3"/>
                        <path d="M 140 80 Q 200 60 260 80 L 260 190 Q 200 270 140 190 Z" fill="#1e293b" stroke="#d97706" stroke-width="4"/>
                        <path d="M 90 200 C 60 160 80 100 130 90 C 110 120 125 145 140 150 C 120 170 110 190 90 200 Z" fill="#d97706"/>
                        <path d="M 310 200 C 340 160 320 100 270 90 C 290 120 275 145 260 150 C 280 170 290 190 310 200 Z" fill="#d97706"/>
                        <rect x="155" y="150" width="90" height="65" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="4"/>
                        <path d="M 150 150 Q 200 125 250 150 Z" fill="#d97706" stroke="#fbbf24" stroke-width="4"/>
                        <circle cx="200" cy="180" r="7" fill="#fbbf24"/>
                    </svg>
                </div>
                <h2 class="text-2xl font-bold text-amber-400">Welcome to LootBox</h2>
                <p class="text-sm text-slate-400 mt-1">Sign in as a Player or Game Master</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-300 mb-1">Character / User Name</label>
                    <input type="text" id="login-username" required placeholder="e.g. Valeros, Ezren, or DM" 
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-amber-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-300 mb-1">Session Mode</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="flex items-center justify-center p-3 border border-slate-700 rounded-lg bg-slate-900/50 cursor-pointer hover:border-amber-500/50">
                            <input type="radio" name="user-role" value="player" checked class="text-amber-500 focus:ring-amber-500">
                            <span class="ml-2 text-sm font-medium">Player</span>
                        </label>
                        <label class="flex items-center justify-center p-3 border border-slate-700 rounded-lg bg-slate-900/50 cursor-pointer hover:border-amber-500/50">
                            <input type="radio" name="user-role" value="dm" class="text-amber-500 focus:ring-amber-500">
                            <span class="ml-2 text-sm font-medium">Dungeon Master</span>
                        </label>
                    </div>
                </div>

                <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold py-3 rounded-lg shadow-lg transition flex items-center justify-center gap-2">
                    <i data-lucide="shield-check" class="w-5 h-5"></i> Enter Session
                </button>
            </form>
        </section>

        <!-- APP CONTENT SECTIONS (Hidden until login) -->
        <div id="app-content" class="hidden space-y-6">

            <!-- PLAYER INVENTORY TAB -->
            <section id="tab-inventory" class="tab-page space-y-6">
                <!-- Coin Purse & Weight Bar -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Purse -->
                    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow">
                        <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-3 flex items-center justify-between">
                            <span class="flex items-center gap-2"><i data-lucide="coins" class="w-4 h-4 text-amber-400"></i> Coin Purse</span>
                            <button onclick="savePurse()" class="text-xs bg-amber-600/20 text-amber-400 hover:bg-amber-600/30 px-2 py-1 rounded border border-amber-500/30">Update</button>
                        </h3>
                        <div class="grid grid-cols-4 gap-2 text-center">
                            <div class="bg-slate-900 p-2 rounded-lg border border-slate-700">
                                <span class="text-xs text-cyan-400 font-bold block">PP</span>
                                <input type="number" id="coin-pp" value="0" min="0" class="w-full bg-transparent text-center font-bold text-lg focus:outline-none">
                            </div>
                            <div class="bg-slate-900 p-2 rounded-lg border border-slate-700">
                                <span class="text-xs text-amber-400 font-bold block">GP</span>
                                <input type="number" id="coin-gp" value="50" min="0" class="w-full bg-transparent text-center font-bold text-lg focus:outline-none">
                            </div>
                            <div class="bg-slate-
